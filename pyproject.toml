[project]
name = "minnal"
version = "0.1.0"
description = "Agentic storm-restoration war room for power utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools==3.35.0",
    "bedrock-agentcore==1.23.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyproj==3.8.0",
    "python-ulid==4.0.1",
    "pyyaml==6.0.3",
    "shapely==2.1.2",
    "strands-agents==1.57.1",
]

[dependency-groups]
dev = [
    "cedarpy==4.12.1",
    "freezegun==1.5.5",
    "hypothesis==6.168.3",
    "moto==5.2.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
    "ruff==0.16.9",
    "types-jsonschema==4.26.0.20260518",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
# Application workspace, not a distributable package: install dependencies only.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["patterns/agui-minnal"]
files = [
    "patterns/agui-minnal/config/settings.py",
    "patterns/agui-minnal/domain",
    "gateway/tools/*/logic.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "gateway/tools"]
markers = [
    "safety: required safety-gate property test (design.md Safety gate, R20.5)",
    "slow: non-gating performance benchmark (Requirement 19, DEFERRED)",
]
